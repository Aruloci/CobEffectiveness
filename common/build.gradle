architectury {
    common rootProject.enabled_platforms.split(',')
}

// The pure logic (type chart, icon sheet, HUD model) carries no Minecraft state, so it is unit
// tested here. Tests reuse the main classpath rather than redeclaring Minecraft, Cobblemon, Gson
// and SLF4J versions of their own.
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation  "com.cobblemon:mod:${rootProject.cobblemon_version}"
    compileOnly "net.neoforged:bus:${rootProject.neoforge_eventbus_version}"

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // compileOnly above keeps the bus off the runtime classpath, but the mod facade needs it.
    testRuntimeOnly "net.neoforged:bus:${rootProject.neoforge_eventbus_version}"
}

tasks.named("test") {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}
